name: Evaluation

# Runs the full pipeline with the real models on a CPU runner, so it is slow (about 20-40 minutes)
# and runs on demand and weekly rather than on every push.
on:
  workflow_dispatch:
    inputs:
      stages:
        description: "Stages to run"
        default: "routing,retrieval,answer"
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      CUSTOMER_API_URL: http://localhost:8001
      OLLAMA_MODELS: /home/runner/ollama-models
      STAGES: ${{ inputs.stages || 'routing,retrieval,answer' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: /home/runner/ollama-models
          key: ollama-llama3.2-1b-llama3.2-all-minilm-l6-v2
      - name: Install Ollama and pull the models
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true   # run it as this user, with the cached model directory
          nohup ollama serve > ollama.log 2>&1 &
          timeout 60 bash -c 'until curl -fsS http://localhost:11434/api/version >/dev/null; do sleep 1; done'
          ollama pull llama3.2:1b
          ollama pull llama3.2:latest
          ollama pull all-minilm:l6-v2

      - name: Wait for Floci
        run: timeout 90 bash -c 'until curl -fsS http://localhost:4566/_floci/health >/dev/null; do sleep 2; done'
      - name: Upload and index the policy documents
        run: |
          python -m ingestion.dms
          python -m ingestion.index
      - name: Start the customer API
        run: |
          nohup python -m uvicorn customer_api.server:app --port 8001 > customer-api.log 2>&1 &
          timeout 60 bash -c 'until curl -fsS http://localhost:8001/customers >/dev/null; do sleep 1; done'

      - name: Evaluate
        run: python -m evaluation.run_eval --stages "$STAGES"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: |
            evaluation/results/
            ollama.log
            customer-api.log
