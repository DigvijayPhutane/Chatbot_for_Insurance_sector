
x-env: &env
  AWS_ENDPOINT_URL: http://floci:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1
  S3_BUCKET: insurance-docs
  CUSTOMER_API_URL: http://customer-api:8001
  # Ollama runs on the host (no NVIDIA GPU here for a container to use).
  OLLAMA_HOST: http://host.docker.internal:11434
  INTENT_MODEL: ${INTENT_MODEL:-llama3.2:1b}
  MAIN_MODEL: ${MAIN_MODEL:-llama3.2:latest}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-minilm:l6-v2}
  RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
  OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}

# Shared by the Python services. host-gateway makes host.docker.internal resolve on Linux too.
x-python: &python
  build: .
  environment: *env
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  floci:
    image: floci/floci:latest
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: persistent
    volumes:
      - floci-data:/app/data
    restart: unless-stopped

  customer-api:
    <<: *python
    command: uvicorn customer_api.server:app --host 0.0.0.0 --port 8001
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      floci:
        condition: service_healthy   # downloads insurance.db from S3 at startup
    restart: unless-stopped

  app:
    <<: *python
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./vectorstore:/app/vectorstore
      - hf-cache:/root/.cache/huggingface
    depends_on:
      - customer-api
    restart: unless-stopped

  indexer:
    <<: *python
    command: sh -c "python -m ingestion.dms && python -m ingestion.index"
    volumes:
      - ./files:/app/files
      - ./vectorstore:/app/vectorstore
      - hf-cache:/root/.cache/huggingface
    depends_on:
      floci:
        condition: service_healthy
    profiles:
      - tools

volumes:
  floci-data:
  hf-cache:
